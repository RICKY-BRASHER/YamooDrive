services:
  # Base de données PostgreSQL
  postgres:
    image: postgres:15-alpine
    container_name: projet_postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${DB_DATABASE:-yamoo_drive}
      POSTGRES_USER: laravel_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # Gestionnaire de files d'attente (Queues)
  redis:
    image: redis:alpine
    container_name: projet_redis
    ports:
      - "6379:6379"

  # Backend Laravel (Lui seul va compiler)
  backend:
    build:
      context: ./backend
    image: mon_projet_backend_image # On donne un nom à l'image générée
    container_name: projet_backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/var/www/html
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      FRONTEND_URLS: http://localhost:3000
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-yamoo_drive}
      DB_USERNAME: laravel_user
      DB_PASSWORD: ${DB_PASSWORD:-secret_password}
      SESSION_DRIVER: database
      CACHE_STORE: file
      QUEUE_CONNECTION: database
      FILESYSTEM_DISK: public
      MAIL_MAILER: log
      BROADCAST_CONNECTION: reverb
      REVERB_HOST: reverb
      REVERB_PORT: 8080
      REVERB_SCHEME: http
      REVERB_SERVER_HOST: 0.0.0.0
      REVERB_SERVER_PORT: 8080
    depends_on:
      - postgres
      - redis

  reverb:
    image: mon_projet_backend_image
    container_name: projet_reverb
    command: sh -c 'until php artisan about >/dev/null 2>&1; do sleep 1; done; php artisan reverb:start --host=0.0.0.0 --port=8080'
    ports:
      - target: 8080
        published: "8080"
        host_ip: 0.0.0.0
        protocol: tcp
    volumes:
      - ./backend:/var/www/html
    environment:
      APP_ENV: local
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-yamoo_drive}
      DB_USERNAME: laravel_user
      DB_PASSWORD: ${DB_PASSWORD:-secret_password}
      SESSION_DRIVER: database
      CACHE_STORE: file
      QUEUE_CONNECTION: database
      FILESYSTEM_DISK: public
      BROADCAST_CONNECTION: reverb
      REVERB_HOST: reverb
      REVERB_PORT: 8080
      REVERB_SCHEME: http
      REVERB_SERVER_HOST: 0.0.0.0
      REVERB_SERVER_PORT: 8080
      FRONTEND_URLS: http://localhost:3000
    depends_on:
      - backend

  # Worker Laravel (Il RÉUTILISE l'image du backend sans recompiler !)
  queue-worker:
    image: mon_projet_backend_image # <--- ICI : On réutilise l'image déjà prête
    container_name: projet_worker
    command: php artisan queue:work
    volumes:
      - ./backend:/var/www/html
    environment:
      APP_ENV: local
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-yamoo_drive}
      DB_USERNAME: laravel_user
      DB_PASSWORD: ${DB_PASSWORD:-secret_password}
      SESSION_DRIVER: database
      CACHE_STORE: file
      QUEUE_CONNECTION: database
      FILESYSTEM_DISK: public
    depends_on:
      - backend
      - redis

  # Frontend React (Vite + TypeScript)
  frontend:
    build:
      context: ./frontend
    container_name: projet_frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
      - VITE_REVERB_HOST=localhost
      - VITE_REVERB_PORT=3000
      - VITE_REVERB_SCHEME=http
      - VITE_API_URL=${VITE_API_URL:-http://localhost:8000/api}
      - REVERB_PROXY_TARGET=http://reverb:8080

volumes:
  postgres_data:
  frontend_node_modules:
